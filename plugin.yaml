name: hermes-web-crawl4ai
version: 0.2.0
description: "Self-hosted Crawl4AI extraction backend and bounded crawl tool for Hermes."
author: axAilotl
kind: backend
requires_hermes: ">=0.23.0"
provides_web_providers:
  - crawl4ai-bounded
provides_tools:
  - crawl4ai_crawl
python_dependencies:
  - "httpx>=0.27,<1"
config_schema:
  api_token:
    type: secret
    env: CRAWL4AI_API_TOKEN
    description: "Optional Bearer token, stored by Hermes in the active profile secret store."
  api_url:
    type: str
    description: "Crawl4AI service URL; falls back to CRAWL4AI_URL."
  timeout_seconds:
    type: int
    default: 120
  crawl_timeout_seconds:
    type: int
    default: 180
  concurrency:
    type: int
    default: 4
  max_chars_per_page:
    type: int
    default: 20000
